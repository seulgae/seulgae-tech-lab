map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Funnel 경로는 왕복이 약 1초라 전송량과 재요청 수가 체감 로딩을 좌우한다.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 빌드 해시가 붙은 정적 파일은 내용이 바뀌면 이름도 바뀌므로 1년간 재검증 없이 재사용한다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    # 진입 HTML은 새 배포를 바로 받도록 매번 재검증한다.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /api/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /ws/lobby {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        # 로비 1주소 1연결 판단용. Funnel이 실제 방문자 주소로 새로 쓴 값을 그대로 넘긴다.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }
    location /actuator/ { return 404; }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
