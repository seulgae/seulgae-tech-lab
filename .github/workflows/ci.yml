name: Build and deploy tech lab
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tech-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: research_ci
          POSTGRES_PASSWORD: ci-test-only
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d research_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare disposable PostgreSQL roles
        env:
          PGPASSWORD: ci-test-only
        run: psql -h 127.0.0.1 -U postgres -d research_ci -v ON_ERROR_STOP=1 -f backend/src/test/resources/bootstrap-ci.sql
      - name: Migrate and validate disposable schema
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/research_ci?currentSchema=lab
          DB_USERNAME: test_migrator
          DB_PASSWORD: ci-migrator-only
        run: mvn -B -f backend/pom.xml flyway:migrate flyway:validate
      - run: mvn -B -f backend/pom.xml verify
        env:
          RECRUITMENT_TEST_DB: 'true'
      - name: Exercise HTTP API against disposable PostgreSQL
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/research_ci?currentSchema=lab
          DB_USERNAME: test_app
          DB_PASSWORD: ci-app-only
          LAB_RESEARCH_WRITE_ENABLED: 'true'
          LAB_WRITE_CLIENT_CAPACITY: '100'
          TEST_DATABASE_DISPOSABLE: 'true'
        run: |
          java -jar backend/target/tech-lab-0.0.1-SNAPSHOT.jar > "$RUNNER_TEMP/research-backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid"' EXIT
          node backend/tests/research-api.mjs
      - run: docker build -f backend/Dockerfile -t tech-lab-backend:ci .
      - run: docker build -f frontend/Dockerfile -t tech-lab-frontend:ci .
      - name: Validate nginx config, compression and cache headers
        run: |
          docker run --rm --add-host backend:127.0.0.1 tech-lab-frontend:ci nginx -t
          docker run -d --name nginx-ci --add-host backend:127.0.0.1 -p 127.0.0.1:18090:8080 tech-lab-frontend:ci
          trap 'docker rm -f nginx-ci >/dev/null' EXIT
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:18090/ && break; sleep 1; done
          asset=$(curl -fsS http://127.0.0.1:18090/ | grep -oE '/assets/index-[^"]+\.js' | head -1)
          test -n "$asset"
          headers=$(curl -fsS -o /dev/null -D - -H 'Accept-Encoding: gzip' "http://127.0.0.1:18090$asset")
          echo "$headers"
          echo "$headers" | grep -qi '^content-encoding: gzip'
          echo "$headers" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          curl -fsS -o /dev/null -D - http://127.0.0.1:18090/ | grep -qi '^cache-control: no-cache'
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for script in deploy.sh start.sh stop.sh restart.sh status.sh logs.sh rollback.sh deploy/deploy.sh; do bash -n "$script"; done
      - run: python3 -m unittest discover -s deploy -p 'test_*.py' -v
  publish:
    needs: [frontend, backend, operations]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ghcr.io/seulgae/seulgae-tech-lab-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/seulgae/seulgae-tech-lab
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=tech-lab-backend
          cache-to: type=gha,mode=max,scope=tech-lab-backend
      - name: Publish frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/seulgae/seulgae-tech-lab-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/seulgae/seulgae-tech-lab
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=tech-lab-frontend
          cache-to: type=gha,mode=max,scope=tech-lab-frontend
      - name: Publish deployment manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json,os
          manifest = dict(format=1, repository=os.environ['GITHUB_REPOSITORY'],
                          sha=os.environ['GITHUB_SHA'], run_id=int(os.environ['GITHUB_RUN_ID']),
                          db_schema=dict(min=14,max=14),
                          images={s:'ghcr.io/seulgae/seulgae-tech-lab-'+s+'@'+os.environ[s.upper()+'_DIGEST']
                                  for s in ('backend','frontend')})
          with open('release.json','w') as f: json.dump(manifest,f,indent=2)
          PY
          gh release create "deploy-run-$GITHUB_RUN_ID" release.json \
            --target "$GITHUB_SHA" --title "Deployable tech lab $GITHUB_SHA" \
            --notes "Pinned application images from validated main CI. DB schema compatibility: 14." \
            --prerelease --latest=false
