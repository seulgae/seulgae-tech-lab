spring:
  application:
    name: seulgae-tech-lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:25432/stlab_dev?currentSchema=lab}
    username: ${DB_USERNAME:stlab_dev_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
  sql:
    init:
      mode: never
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
