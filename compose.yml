name: seulgae-tech-lab
services:
  frontend:
    image: seulgae-tech-lab-frontend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:18082:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge, app]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  backend:
    image: seulgae-tech-lab-backend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres-postgres-1:5432/stlab_prod?currentSchema=lab
      DB_USERNAME: stlab_prod_app
      # Config-tree key DB_PASSWORD resolves the application placeholder.
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_SQL_INIT_MODE: never
      SPRING_FLYWAY_ENABLED: "false"
      LAB_MULTIPLAYER_ALLOWED_ORIGINS: https://seulgae-home-server.tailac4b36.ts.net,http://127.0.0.1:5188,http://localhost:5188
      # 한 주소(IP)에 로비 연결 하나만 둔다. 같은 주소의 새 창이 기존 연결을 끊는다.
      LAB_MULTIPLAYER_SINGLE_CONNECTION_PER_ADDRESS: "true"
      SERVER_ADDRESS: 0.0.0.0
      # 카카오 로그인(docs/kakao-login.md). REST API 키와 Redirect URI는 공개 값이고, 비밀 값은 아래 secrets로만 넣는다.
      LAB_AUTH_KAKAO_CLIENT_ID: 8e235c19470d153bef77ad4ddddc3f23
      LAB_AUTH_KAKAO_REDIRECT_URI: https://seulgae-home-server.tailac4b36.ts.net/api/auth/kakao/callback
      # 관리자실(쿼리 콘솔)에 들어갈 수 있는 회원 id(lab.members.id). IP가 바뀌어도 로그인 회원으로 확인한다.
      LAB_ADMIN_MEMBER_IDS: 45678072-690e-4b6f-a647-f083cf3d95c9
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:ActiveProcessorCount=2
    secrets:
      - source: prod_db_password
        target: DB_PASSWORD
      # configtree가 파일 이름을 속성 이름으로 읽는다.
      - source: kakao_client_secret
        target: lab.auth.kakao.client-secret
      - source: auth_session_secret
        target: lab.auth.session-secret
    networks: [app, database]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *logging
networks:
  edge: {}
  app:
    internal: true
  database:
    external: true
    name: postgres_backend
secrets:
  prod_db_password:
    file: ${STLAB_SECRETS_DIR:-/opt/homeserver/config/seulgae-tech-lab}/prod-app-password
  kakao_client_secret:
    file: ${STLAB_SECRETS_DIR:-/opt/homeserver/config/seulgae-tech-lab}/kakao-client-secret
  auth_session_secret:
    file: ${STLAB_SECRETS_DIR:-/opt/homeserver/config/seulgae-tech-lab}/auth-session-secret
